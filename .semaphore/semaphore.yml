version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Terraform Init
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Terraform Init"
          commands:
            - cd 1-terraform-apply
            - echo "Terraform init"
            - terraform init
            - 'artifact push workflow .terraform '
            - 'artifact push workflow .terraform.lock.hcl '
      secrets:
        - name: localstack
  - name: "\U0001F680 Deploy"
    dependencies:
      - Terraform Init
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - 'docker run -d -p 4566:4566 localstack/localstack'
            - sleep 20
            - echo "ok"
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod -R +x .terraform
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack

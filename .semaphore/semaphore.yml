version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Terraform Init
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Terraform Init"
          commands:
            - cd 1-terraform-apply
            - terraform init
            - artifact push project .terraform
            - artifact push project .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: "\U0001F680 Deploy"
    dependencies:
      - Terraform Init
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - echo "Building application..."
            - echo "Running security checks..."
            - echo "Deploying to production..."
            - echo "Deployment completed successfully!"

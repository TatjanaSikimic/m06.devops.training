version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Terraform Init
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Terraform Init"
          commands:
            - cd 1-terraform-apply
            - terraform init
            - artifact push project .terraform --force
            - artifact push project .terraform.lock.hcl --force
      secrets:
        - name: localstack
  - name: "\U0001F680 Deploy"
    dependencies:
      - Terraform Init
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - cd 1-terraform-apply
            - 'docker run -d -p 4566:4566 -p 4510-4559:4510-4559 localstack/localstack'
            - sleep 10
            - artifact pull project .terraform
            - artifact pull project .terraform.lock.hcl
            - chmod -R +x .terraform
            - terraform validate
            - terraform apply -auto-approve
            - artifact push terraform.tfstate --force
      secrets:
        - name: localstack

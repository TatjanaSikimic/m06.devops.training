version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Terraform Init
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Terraform Init"
          commands:
            - cd 1-terraform-apply
            - echo "Terraform init"
            - terraform init
            - 'artifact push workflow .terraform '
            - 'artifact push workflow .terraform.lock.hcl '
      secrets:
        - name: localstack
  - name: "\U0001F680 Deploy"
    dependencies:
      - Terraform Init
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - cd 1-terraform-apply
            - echo "Terraform deployment"
            - 'artifact pull workflow .terraform  '
            - artifact pull workflow .terraform.lock.hcl
            - chmod -R +x .terraform
            - 'terraform validate  '
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
  - name: Use the bucket
    dependencies:
      - "\U0001F680 Deploy"
    task:
      jobs:
        - name: Use the bucket
          commands:
            - cd 1-terraform-apply
            - 'aws s3 cp README.md s3://s3-g2-bucket-tatjana/'
            - 'aws s3 ls s3://s3-g2-bucket-tatjana'
            - 'aws s3 rm s3://s3-g2-bucket-tatjana/README.md'
      secrets:
        - name: localstack
  - name: Destroy
    dependencies:
      - Use the bucket
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Pulling the artifacts
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform --force
            - artifact pull workflow .terraform.lock.hcl --force
            - artifact pull workflow terraform.tfstate --force
            - chmod -R +x .terraform
            - terraform destroy -auto-approve
  - name: 2-terraform-ec2-deploy
    dependencies:
      - Terraform Init
    task:
      jobs:
        - name: Deploy
          commands:
            - cd 2-terraform-ec2
            - 'artifact pull workflow .terraform '
            - 'artifact pull workflow .terraform.lock.hcl '
            - chmod -R +x .terraform
            - 'terraform validate  '
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate --force
      secrets:
        - name: localstack
  - name: 2-terraform-ec2-destroy
    dependencies:
      - 2-terraform-ec2-deploy
    task:
      jobs:
        - name: Destroy
          commands:
            - cd 2-terraform-ec2
            - artifact pull workflow .terraform --force
            - artifact pull workflow .terraform.lock.hcl --force
            - artifact pull workflow terraform.tfstate --force
            - chmod -R +x .terraform
            - terraform destroy -auto-approve
      secrets:
        - name: localstack
  - name: 3-terraform_dynamodb-deploy
    dependencies:
      - Terraform Init
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Deploy
          commands:
            - cd 3-terraform-dynamodb
            - echo "Deploy"
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod -R +x .terraform
            - aws dynamodb delete-table --table-name tatjana-table
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate --force
  - name: 'Interact '
    dependencies:
      - 3-terraform_dynamodb-deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Interact with the table
          commands:
            - cd 3-terraform-dynamodb
            - aws dynamodb list-tables
            - aws dynamodb describe-table --table-name tatjana-table
            - 'aws dynamodb put-item --table-name tatjana-table --item ''{"user_id": {"S": "u1"}, "name": {"S": "Alice"}, "email": {"S": "alice@example.com"}}'''
            - aws dynamodb scan --table-name tatjana-table
  - name: 'Block #9'
    dependencies:
      - 'Interact '
    task:
      jobs:
        - name: 'Job #1'
          commands: []
